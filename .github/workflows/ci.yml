name: SleepGuide checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sleepguide_test
          POSTGRES_USER: sleepguide
          POSTGRES_PASSWORD: sleepguide
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sleepguide -d sleepguide_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENV: dev
      DATABASE_URL: postgresql+asyncpg://sleepguide:sleepguide@localhost:5432/sleepguide_test
      TEST_DATABASE_URL: postgresql+asyncpg://sleepguide:sleepguide@localhost:5432/sleepguide_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install '.[dev]'
      - run: ruff check .
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m pytest -q
      - run: for script in ../deploy/*.sh; do bash -n "$script"; done
      - run: python scripts/export_openapi.py
      - run: git diff --exit-code -- ../docs/openapi.json
      - run: alembic downgrade 0005 && alembic upgrade head && alembic check
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run gen:api
      - run: git diff --exit-code -- src/types/api.gen.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
