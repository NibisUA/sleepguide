# Production stack for a single VM (e.g. Oracle Cloud Always Free):
#   web     - Caddy: HTTPS (Let's Encrypt), static frontend, reverse proxy to the backend
#   backend - FastAPI + Telegram bot (runs Alembic migrations on start)
#   db      - PostgreSQL (not exposed outside the Docker network)
#
# Run: docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: sleepguide
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: sleepguide
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sleepguide"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    logging: *logging
    environment:
      ENV: prod
      DATABASE_URL: postgresql+asyncpg://sleepguide:${POSTGRES_PASSWORD}@db:5432/sleepguide
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN in .env.prod}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.prod}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set WEBHOOK_SECRET in .env.prod}
      MINI_APP_URL: https://${DOMAIN}
      WEBHOOK_BASE_URL: https://${DOMAIN}
      CORS_ORIGINS: '["https://${DOMAIN}"]'
      DEV_LOGIN_ENABLED: "false"
      TRUSTED_PROXY_IPS: '["172.30.28.2"]'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      start_period: 30s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_PRIVACY_OWNER: ${PRIVACY_OWNER:-}
        VITE_PRIVACY_CONTACT: ${PRIVACY_CONTACT:-}
        VITE_PRIVACY_APPROVED: ${PRIVACY_APPROVED:-false}
    restart: unless-stopped
    logging: *logging
    networks:
      default:
        ipv4_address: 172.30.28.2
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.prod}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - caddy_data:/data
      - caddy_config:/config

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.28.0/24
          ip_range: 172.30.28.128/25
          gateway: 172.30.28.1

volumes:
  pgdata:
  caddy_data:
  caddy_config:
